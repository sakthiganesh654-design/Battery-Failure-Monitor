<script>
    // Firebase Configuration
    const firebaseConfig = {
        databaseURL: "https://battery-failure-monitor-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // State variables
    let systemState = {
        alert: false,
        lastUpdate: null,
        faults: [],
        connectionStatus: 'disconnected',
        temperatureHistory: [],
        loadHistory: [],
        faultHistory: [],
        startTime: Date.now(),
        lastStatsUpdate: Date.now(),
        buzzerActive: false,
        liveData: null
    };

    // Charts
    let faultsChart = null;
    let tempChart = null;
    let loadChart = null;

    // DOM Elements
    const elements = {
        systemStatus: document.getElementById('systemStatus'),
        statusDot: document.querySelector('.status-dot'),
        statusText: document.querySelector('.status-text'),
        lastUpdate: document.getElementById('lastUpdate'),
        
        // Battery elements
        cell1: document.getElementById('cell1'),
        cell2: document.getElementById('cell2'),
        cell3: document.getElementById('cell3'),
        progress1: document.getElementById('progress1'),
        progress2: document.getElementById('progress2'),
        progress3: document.getElementById('progress3'),
        totalVoltage: document.getElementById('totalVoltage'),
        
        // Temperature elements - Unified design
        irTemp: document.getElementById('irTemp'),
        batTemp: document.getElementById('batTemp'),
        irStatus: document.getElementById('irStatus'),
        batStatus: document.getElementById('batStatus'),
        irGauge: document.getElementById('irGauge'),
        batGauge: document.getElementById('batGauge'),
        
        // Gas elements - Unified design
        gas1: document.getElementById('gas1'),
        gas2: document.getElementById('gas2'),
        gas1Status: document.getElementById('gas1Status'),
        gas2Status: document.getElementById('gas2Status'),
        gas1Indicator: document.getElementById('gas1Indicator'),
        gas2Indicator: document.getElementById('gas2Indicator'),
        
        // Control elements
        fanSpeed: document.getElementById('fanSpeed'),
        fanAnimation: document.getElementById('fanAnimation'),
        relayStatus: document.getElementById('relayStatus'),
        relayIndicator: document.getElementById('relayIndicator'),
        buzzerStatus: document.getElementById('buzzerStatus'),
        buzzerIndicator: document.getElementById('buzzerIndicator'),
        
        // Fault elements
        faultList: document.getElementById('faultList'),
        refreshFaults: document.getElementById('refreshFaults'),
        
        // Stats elements
        uptime: document.getElementById('uptime'),
        uptimeTrend: document.getElementById('uptimeTrend'),
        faultsToday: document.getElementById('faultsToday'),
        faultsTrend: document.getElementById('faultsTrend'),
        avgTemp: document.getElementById('avgTemp'),
        tempTrend: document.getElementById('tempTrend'),
        systemLoad: document.getElementById('systemLoad'),
        loadTrend: document.getElementById('loadTrend'),
        
        // Connection elements
        wifiIcon: document.getElementById('wifiIcon'),
        connectionStatus: document.getElementById('connectionStatus'),
        
        // Modal elements
        modal: document.getElementById('faultDetailModal'),
        modalClose: document.querySelector('.modal-close'),
        faultDetailContent: document.getElementById('faultDetailContent'),
        resolveFaultBtn: document.getElementById('resolveFaultBtn')
    };

    // Initialize the application
    function init() {
        console.log("Initializing Battery Monitor...");
        setupEventListeners();
        initializeCharts();
        connectToFirebase();
        startUptimeCounter();
        loadFaults();
    }

    // Setup event listeners
    function setupEventListeners() {
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterFaults(btn.dataset.filter);
            });
        });
        
        // Refresh faults button
        elements.refreshFaults.addEventListener('click', loadFaults);
        
        // Modal close buttons
        document.querySelectorAll('.modal-close').forEach(btn => {
            btn.addEventListener('click', () => {
                elements.modal.classList.remove('active');
            });
        });
        
        // Close modal on background click
        elements.modal.addEventListener('click', (e) => {
            if (e.target === elements.modal) {
                elements.modal.classList.remove('active');
            }
        });
        
        // Resolve fault button
        elements.resolveFaultBtn.addEventListener('click', resolveCurrentFault);
    }

    // Initialize charts
    function initializeCharts() {
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { enabled: false }
            },
            scales: {
                x: { display: false },
                y: { display: false }
            },
            elements: {
                point: { radius: 0 },
                line: { 
                    tension: 0.4,
                    borderWidth: 2
                }
            }
        };

        // Faults Chart
        const faultsCtx = document.getElementById('faultsChart').getContext('2d');
        faultsChart = new Chart(faultsCtx, {
            type: 'line',
            data: {
                labels: Array.from({length: 10}, (_, i) => i),
                datasets: [{
                    data: Array(10).fill(0),
                    borderColor: '#f72585',
                    backgroundColor: 'rgba(247, 37, 133, 0.1)',
                    fill: true
                }]
            },
            options: chartOptions
        });

        // Temperature Chart
        const tempCtx = document.getElementById('tempChart').getContext('2d');
        tempChart = new Chart(tempCtx, {
            type: 'line',
            data: {
                labels: Array.from({length: 10}, (_, i) => i),
                datasets: [{
                    data: Array(10).fill(0),
                    borderColor: '#4cc9f0',
                    backgroundColor: 'rgba(76, 201, 240, 0.1)',
                    fill: true
                }]
            },
            options: chartOptions
        });

        // Load Chart
        const loadCtx = document.getElementById('loadChart').getContext('2d');
        loadChart = new Chart(loadCtx, {
            type: 'line',
            data: {
                labels: Array.from({length: 10}, (_, i) => i),
                datasets: [{
                    data: Array(10).fill(0),
                    borderColor: '#4361ee',
                    backgroundColor: 'rgba(67, 97, 238, 0.1)',
                    fill: true
                }]
            },
            options: chartOptions
        });
    }

    // Connect to Firebase
    function connectToFirebase() {
        const liveDataRef = database.ref('/battery_monitor/live');
        const faultLogRef = database.ref('/fault_log');
        
        console.log("Connecting to Firebase...");
        
        // Monitor connection status
        database.ref('.info/connected').on('value', (snapshot) => {
            const connected = snapshot.val();
            systemState.connectionStatus = connected ? 'connected' : 'disconnected';
            updateConnectionStatus();
            
            if (connected) {
                console.log("✅ Connected to Firebase");
            } else {
                console.log("❌ Disconnected from Firebase");
            }
        });
        
        // Listen for live data updates
        liveDataRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                systemState.liveData = data;
                updateDashboard(data);
                systemState.lastUpdate = new Date();
                updateLastUpdate();
            } else {
                console.log("No live data received from Firebase");
            }
        }, (error) => {
            console.error("Error reading live data:", error);
        });
        
        // Listen for fault log updates
        faultLogRef.on('value', (snapshot) => {
            const faults = snapshot.val();
            if (faults) {
                systemState.faults = Object.values(faults);
                console.log(`Loaded ${systemState.faults.length} faults from Firebase`);
                updateFaultList();
                updateStats();
            } else {
                systemState.faults = [];
                console.log("No faults in database");
                updateFaultList();
                updateStats();
            }
        }, (error) => {
            console.error("Error reading fault log:", error);
        });
    }

    // Update dashboard with live data
    function updateDashboard(data) {
        // Update system status
        systemState.alert = data.system_alert || false;
        updateSystemStatus();
        
        // Update battery data
        updateBatteryData(data);
        
        // Update temperature data
        updateTemperatureData(data);
        
        // Update gas data
        updateGasData(data);
        
        // Update control data
        updateControlData(data);
        
        // Update statistics
        updateStatistics(data);
    }

    // Update battery data
    function updateBatteryData(data) {
        const bat1 = data.battery?.cell1_v || 0;
        const bat2 = data.battery?.cell2_v || 0;
        const bat3 = data.battery?.cell3_v || 0;
        
        // Update cell voltages
        elements.cell1.textContent = bat1.toFixed(2) + ' V';
        elements.cell2.textContent = bat2.toFixed(2) + ' V';
        elements.cell3.textContent = bat3.toFixed(2) + ' V';
        
        // Update progress bars (assuming 3.0V min, 4.25V max)
        elements.progress1.style.width = Math.min(Math.max((bat1 - 3.0) / (4.25 - 3.0) * 100, 0), 100) + '%';
        elements.progress2.style.width = Math.min(Math.max((bat2 - 3.0) / (4.25 - 3.0) * 100, 0), 100) + '%';
        elements.progress3.style.width = Math.min(Math.max((bat3 - 3.0) / (4.25 - 3.0) * 100, 0), 100) + '%';
        
        // Update total voltage
        const totalV = bat1 + bat2 + bat3;
        elements.totalVoltage.textContent = totalV.toFixed(2) + ' V';
        
        // Change color based on voltage
        updateElementColor(elements.cell1, bat1, 3.0, 4.25);
        updateElementColor(elements.cell2, bat2, 3.0, 4.25);
        updateElementColor(elements.cell3, bat3, 3.0, 4.25);
    }

    // Update temperature data - Unified design
    function updateTemperatureData(data) {
        const irTemp = data.ir_temp_c || 0;
        const batTemp = data.battery_temp_c || 0;
        
        // Update temperature values
        elements.irTemp.textContent = irTemp.toFixed(1);
        elements.batTemp.textContent = batTemp.toFixed(1);
        
        // Update gauges (assuming 0-100°C range)
        elements.irGauge.style.width = Math.min((irTemp / 100) * 100, 100) + '%';
        elements.batGauge.style.width = Math.min((batTemp / 100) * 100, 100) + '%';
        
        // Update status and color for IR Sensor
        updateTemperatureStatus(elements.irTemp, elements.irStatus, irTemp, 60);
        
        // Update status and color for Battery Temp
        updateTemperatureStatus(elements.batTemp, elements.batStatus, batTemp, 55);
    }

    // Update temperature status
    function updateTemperatureStatus(element, statusElement, temp, limit) {
        // Change color based on temperature
        if (temp < limit * 0.7) {
            element.style.color = '#4cc9f0'; // Safe
            statusElement.textContent = 'NORMAL';
            statusElement.className = 'temp-status';
        } else if (temp < limit * 0.9) {
            element.style.color = '#f8961e'; // Warning
            statusElement.textContent = 'WARNING';
            statusElement.className = 'temp-status warning';
        } else {
            element.style.color = '#f72585'; // Danger
            statusElement.textContent = 'ALERT';
            statusElement.className = 'temp-status danger';
        }
    }

    // Update gas data - Unified design
    function updateGasData(data) {
        const gas1 = data.gas1_percent || 0;
        const gas2 = data.gas2_percent || 0;
        
        elements.gas1.textContent = gas1;
        elements.gas2.textContent = gas2;
        
        elements.gas1Indicator.style.width = gas1 + '%';
        elements.gas2Indicator.style.width = gas2 + '%';
        
        // Update status and color for Gas Sensor 1
        updateGasStatus(elements.gas1, elements.gas1Status, gas1, 50);
        
        // Update status and color for Gas Sensor 2
        updateGasStatus(elements.gas2, elements.gas2Status, gas2, 50);
    }

    // Update gas status
    function updateGasStatus(element, statusElement, gasLevel, limit) {
        // Change color based on gas level
        if (gasLevel < limit * 0.5) {
            element.style.color = '#4cc9f0'; // Safe
            statusElement.textContent = 'SAFE';
            statusElement.className = 'gas-status';
        } else if (gasLevel < limit * 0.8) {
            element.style.color = '#f8961e'; // Warning
            statusElement.textContent = 'WARNING';
            statusElement.className = 'gas-status warning';
        } else {
            element.style.color = '#f72585'; // Danger
            statusElement.textContent = 'ALERT';
            statusElement.className = 'gas-status danger';
        }
    }

    // Update control data - FIXED BUZZER STATUS
    function updateControlData(data) {
        const fanSpeed = data.fan_speed_percent || 0;
        const relayStatus = data.relay_status === 'ON';
        const buzzerStatus = data.buzzer_status === 'ACTIVE' || data.system_alert; // Get buzzer status
        
        elements.fanSpeed.textContent = fanSpeed + ' %';
        elements.relayStatus.textContent = relayStatus ? 'ON' : 'OFF';
        elements.buzzerStatus.textContent = buzzerStatus ? 'ACTIVE' : 'INACTIVE';
        
        console.log("Buzzer Status Update:", {
            buzzer_status: data.buzzer_status,
            system_alert: data.system_alert,
            calculated: buzzerStatus
        });
        
        // Update animations and indicators
        if (fanSpeed > 0) {
            elements.fanAnimation.classList.add('active');
            elements.fanAnimation.style.animationDuration = (2 - (fanSpeed / 100)) + 's';
        } else {
            elements.fanAnimation.classList.remove('active');
        }
        
        elements.relayIndicator.classList.toggle('on', relayStatus);
        elements.buzzerIndicator.classList.toggle('active', buzzerStatus);
        
        // Update system state
        systemState.buzzerActive = buzzerStatus;
    }

    // Update system status
    function updateSystemStatus() {
        if (systemState.alert) {
            elements.statusDot.className = 'status-dot alert';
            elements.statusText.textContent = 'ALERT - System in Fault State';
            elements.systemStatus.style.background = '#fee';
        } else {
            elements.statusDot.className = 'status-dot safe';
            elements.statusText.textContent = 'SAFE - System Normal';
            elements.systemStatus.style.background = '#e6f7ff';
        }
    }

    // Update last update time
    function updateLastUpdate() {
        if (systemState.lastUpdate) {
            const timeDiff = Math.floor((new Date() - systemState.lastUpdate) / 1000);
            if (timeDiff < 60) {
                elements.lastUpdate.textContent = `Updated: ${timeDiff} seconds ago`;
            } else if (timeDiff < 3600) {
                elements.lastUpdate.textContent = `Updated: ${Math.floor(timeDiff / 60)} minutes ago`;
            } else {
                elements.lastUpdate.textContent = `Updated: ${systemState.lastUpdate.toLocaleTimeString()}`;
            }
        }
    }

    // Update connection status
    function updateConnectionStatus() {
        if (systemState.connectionStatus === 'connected') {
            elements.wifiIcon.className = 'fas fa-wifi connected';
            elements.connectionStatus.textContent = 'Connected';
            elements.connectionStatus.style.color = '#4cc9f0';
        } else {
            elements.wifiIcon.className = 'fas fa-wifi disconnected';
            elements.connectionStatus.textContent = 'Disconnected';
            elements.connectionStatus.style.color = '#f72585';
        }
    }

    // Load faults from Firebase
    function loadFaults() {
        console.log("Loading faults from Firebase...");
        database.ref('/fault_log').once('value')
            .then(snapshot => {
                const faults = snapshot.val();
                if (faults) {
                    systemState.faults = Object.values(faults);
                    console.log(`Loaded ${systemState.faults.length} faults`);
                } else {
                    systemState.faults = [];
                    console.log("No faults found");
                }
                updateFaultList();
                updateStats();
            })
            .catch(error => {
                console.error('Error loading faults:', error);
                showNotification('Error loading faults', 'error');
            });
    }

    // Update fault list - IMPROVED WITH BETTER ERROR HANDLING
    function updateFaultList() {
        const faultList = elements.faultList;
        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';
        
        console.log("Updating fault list:", {
            totalFaults: systemState.faults.length,
            filter: activeFilter
        });
        
        if (systemState.faults.length === 0) {
            faultList.innerHTML = `
                <div class="fault-empty">
                    <i class="fas fa-check-circle"></i>
                    <p>No faults detected</p>
                    <small>System is operating normally</small>
                </div>
            `;
            return;
        }
        
        // Sort faults by timestamp (newest first)
        const sortedFaults = [...systemState.faults].sort((a, b) => {
            const timeA = new Date(a.timestamp || 0).getTime();
            const timeB = new Date(b.timestamp || 0).getTime();
            return timeB - timeA;
        });
        
        // Filter faults
        const filteredFaults = sortedFaults.filter(fault => {
            if (activeFilter === 'all') return true;
            if (activeFilter === 'active') return !fault.resolved;
            if (activeFilter === 'resolved') return fault.resolved;
            return true;
        });
        
        if (filteredFaults.length === 0) {
            faultList.innerHTML = `
                <div class="fault-empty">
                    <i class="fas fa-check-circle"></i>
                    <p>No ${activeFilter === 'active' ? 'active' : 'resolved'} faults</p>
                </div>
            `;
            return;
        }
        
        faultList.innerHTML = filteredFaults.map(fault => createFaultElement(fault)).join('');
        
        // Add click event listeners to fault items
        document.querySelectorAll('.fault-item').forEach(item => {
            item.addEventListener('click', () => showFaultDetail(item.dataset.faultId));
        });
    }

    // Create fault element
    function createFaultElement(fault) {
        const faultTypeIcons = {
            'HIGH_TEMPERATURE_IR': 'fas fa-thermometer-full',
            'HIGH_TEMPERATURE_BATTERY': 'fas fa-fire',
            'GAS_LEAK_1': 'fas fa-wind',
            'GAS_LEAK_2': 'fas fa-smog',
            'BATTERY_VOLTAGE_FAULT_1': 'fas fa-bolt',
            'BATTERY_VOLTAGE_FAULT_2': 'fas fa-bolt',
            'BATTERY_VOLTAGE_FAULT_3': 'fas fa-bolt'
        };
        
        const faultTypeColors = {
            'HIGH_TEMPERATURE_IR': '#f72585',
            'HIGH_TEMPERATURE_BATTERY': '#f8961e',
            'GAS_LEAK_1': '#4361ee',
            'GAS_LEAK_2': '#7209b7',
            'BATTERY_VOLTAGE_FAULT_1': '#4cc9f0',
            'BATTERY_VOLTAGE_FAULT_2': '#4cc9f0',
            'BATTERY_VOLTAGE_FAULT_3': '#4cc9f0'
        };
        
        const icon = faultTypeIcons[fault.faultType] || 'fas fa-exclamation-triangle';
        const resolvedClass = fault.resolved ? 'resolved' : '';
        const date = fault.timestamp ? new Date(fault.timestamp) : new Date();
        const timeString = date.toLocaleString();
        const borderColor = faultTypeColors[fault.faultType] || '#f72585';
        
        return `
            <div class="fault-item ${resolvedClass}" data-fault-id="${fault.id}" style="border-left-color: ${borderColor}">
                <div class="fault-header">
                    <div class="fault-title">
                        <i class="${icon}" style="color: ${borderColor}"></i>
                        ${getFaultTitle(fault.faultType)}
                    </div>
                    <div class="fault-time">${timeString}</div>
                </div>
                <div class="fault-desc">${fault.description || 'No description available'}</div>
                ${fault.value ? `<div class="fault-value">Value: ${fault.value}${getFaultUnit(fault.faultType)}</div>` : ''}
                ${fault.resolved ? '<div class="fault-resolved"><i class="fas fa-check"></i> Resolved</div>' : ''}
            </div>
        `;
    }

    // Get fault title from type
    function getFaultTitle(faultType) {
        const titles = {
            'HIGH_TEMPERATURE_IR': 'High IR Temperature',
            'HIGH_TEMPERATURE_BATTERY': 'High Battery Temperature',
            'GAS_LEAK_1': 'Gas Leak - Sensor 1',
            'GAS_LEAK_2': 'Gas Leak - Sensor 2',
            'BATTERY_VOLTAGE_FAULT_1': 'Battery Cell 1 Fault',
            'BATTERY_VOLTAGE_FAULT_2': 'Battery Cell 2 Fault',
            'BATTERY_VOLTAGE_FAULT_3': 'Battery Cell 3 Fault'
        };
        return titles[faultType] || faultType;
    }

    // Get fault unit from type
    function getFaultUnit(faultType) {
        if (faultType.includes('TEMPERATURE')) return '°C';
        if (faultType.includes('VOLTAGE')) return 'V';
        if (faultType.includes('GAS')) return ' units';
        return '';
    }

    // Filter faults
    function filterFaults(filter) {
        updateFaultList();
    }

    // Show fault detail modal
    function showFaultDetail(faultId) {
        const fault = systemState.faults.find(f => f.id === faultId);
        if (!fault) {
            showNotification('Fault details not found', 'error');
            return;
        }
        
        const date = new Date(fault.timestamp);
        const resolvedDate = fault.resolvedAt ? new Date(fault.resolvedAt) : null;
        
        elements.faultDetailContent.innerHTML = `
            <div class="fault-detail-content">
                <div class="detail-item">
                    <label>Fault ID:</label>
                    <strong>${fault.id || 'N/A'}</strong>
                </div>
                <div class="detail-item">
                    <label>Fault Type:</label>
                    <strong>${getFaultTitle(fault.faultType)}</strong>
                </div>
                <div class="detail-item">
                    <label>Description:</label>
                    <p>${fault.description || 'No description available'}</p>
                </div>
                ${fault.value ? `
                <div class="detail-item">
                    <label>Measured Value:</label>
                    <strong>${fault.value} ${getFaultUnit(fault.faultType)}</strong>
                </div>
                ` : ''}
                <div class="detail-item">
                    <label>Detected At:</label>
                    <strong>${date.toLocaleString()}</strong>
                </div>
                ${resolvedDate ? `
                <div class="detail-item">
                    <label>Resolved At:</label>
                    <strong>${resolvedDate.toLocaleString()}</strong>
                </div>
                ` : ''}
                <div class="detail-item">
                    <label>Status:</label>
                    <strong class="${fault.resolved ? 'status-resolved' : 'status-active'}">
                        ${fault.resolved ? 'Resolved' : 'Active'}
                    </strong>
                </div>
            </div>
        `;
        
        elements.resolveFaultBtn.dataset.faultId = faultId;
        elements.resolveFaultBtn.disabled = fault.resolved;
        elements.modal.classList.add('active');
    }

    // Resolve current fault
    function resolveCurrentFault() {
        const faultId = elements.resolveFaultBtn.dataset.faultId;
        if (!faultId) {
            showNotification('No fault selected', 'error');
            return;
        }
        
        console.log("Resolving fault:", faultId);
        
        database.ref(`/fault_log/${faultId}`).update({
            resolved: true,
            resolvedAt: new Date().toISOString()
        })
        .then(() => {
            showNotification('Fault marked as resolved', 'success');
            elements.modal.classList.remove('active');
            // Reload faults to update the list
            loadFaults();
        })
        .catch(error => {
            console.error('Error resolving fault:', error);
            showNotification('Error resolving fault', 'error');
        });
    }

    // Update statistics
    function updateStatistics(data) {
        const now = Date.now();
        const timeDiff = now - systemState.lastStatsUpdate;
        
        // Update every 5 seconds
        if (timeDiff > 5000) {
            systemState.lastStatsUpdate = now;
            
            // Calculate average temperature from live data
            const irTemp = data.ir_temp_c || 0;
            const batTemp = data.battery_temp_c || 0;
            const avgTemp = (irTemp + batTemp) / 2;
            elements.avgTemp.textContent = avgTemp.toFixed(1);
            
            // Update temperature history for chart
            updateChartData(tempChart, avgTemp);
            
            // Calculate system load from live data
            const systemLoad = data.stats?.system_load || 0;
            elements.systemLoad.textContent = systemLoad.toFixed(0);
            
            // Update load history for chart
            updateChartData(loadChart, systemLoad);
            
            // Update temperature trend
            updateTrendIndicator(elements.tempTrend, systemState.temperatureHistory, avgTemp, '°C');
            
            // Update load trend
            updateTrendIndicator(elements.loadTrend, systemState.loadHistory, systemLoad, '%');
            
            // Store history data
            systemState.temperatureHistory.push({
                timestamp: now,
                value: avgTemp
            });
            
            systemState.loadHistory.push({
                timestamp: now,
                value: systemLoad
            });
            
            // Keep only last 100 data points
            if (systemState.temperatureHistory.length > 100) {
                systemState.temperatureHistory.shift();
            }
            if (systemState.loadHistory.length > 100) {
                systemState.loadHistory.shift();
            }
        }
    }

    // Update chart data
    function updateChartData(chart, newValue) {
        if (!chart) return;
        
        if (chart.data.datasets[0].data.length >= 10) {
            chart.data.datasets[0].data.shift();
        }
        chart.data.datasets[0].data.push(newValue);
        chart.update('none');
    }

    // Update trend indicator
    function updateTrendIndicator(element, history, currentValue, unit) {
        if (history.length < 2) {
            element.textContent = 'Stable';
            element.className = 'stat-trend neutral';
            return;
        }
        
        const prevValue = history[history.length - 1]?.value || 0;
        const diff = currentValue - prevValue;
        const percentChange = prevValue > 0 ? (diff / prevValue) * 100 : 0;
        
        if (Math.abs(percentChange) < 0.5) {
            element.textContent = 'Stable';
            element.className = 'stat-trend neutral';
        } else if (percentChange > 0) {
            element.textContent = `+${percentChange.toFixed(1)}%`;
            element.className = 'stat-trend positive';
        } else {
            element.textContent = `${percentChange.toFixed(1)}%`;
            element.className = 'stat-trend negative';
        }
    }

    // Update stats
    function updateStats() {
        // Update faults today from live data
        const faultsToday = systemState.liveData?.stats?.faults_today || 0;
        elements.faultsToday.textContent = faultsToday;
        
        // Update fault chart
        if (faultsChart) {
            updateChartData(faultsChart, faultsToday);
        }
        
        // Update fault trend
        const activeFaults = systemState.faults.filter(f => !f.resolved).length;
        if (activeFaults > 0) {
            elements.faultsTrend.textContent = `${activeFaults} active`;
            elements.faultsTrend.className = 'stat-trend negative';
        } else {
            elements.faultsTrend.textContent = 'No active faults';
            elements.faultsTrend.className = 'stat-trend positive';
        }
    }

    // Start uptime counter
    function startUptimeCounter() {
        setInterval(() => {
            const now = Date.now();
            const uptimeMs = now - systemState.startTime;
            
            // Calculate uptime components
            const hours = Math.floor(uptimeMs / (1000 * 60 * 60));
            const minutes = Math.floor((uptimeMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((uptimeMs % (1000 * 60)) / 1000);
            
            elements.uptime.textContent = `${hours}h ${minutes}m ${seconds}s`;
            
            // Calculate uptime percentage (based on 24 hours)
            const uptimePercent = (uptimeMs / (24 * 60 * 60 * 1000)) * 100;
            elements.uptimeTrend.textContent = `+${uptimePercent.toFixed(1)}%`;
        }, 1000);
    }

    // Update element color based on value
    function updateElementColor(element, value, min, max) {
        const percentage = Math.min(Math.max((value - min) / (max - min), 0), 1);
        
        if (percentage < 0.5) {
            element.style.color = '#4cc9f0';
        } else if (percentage < 0.8) {
            element.style.color = '#f8961e';
        } else {
            element.style.color = '#f72585';
        }
    }

    // Show notification
    function showNotification(message, type = 'info') {
        // Create notification element
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
            <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
            <span>${message}</span>
        `;
        
        // Add to body
        document.body.appendChild(notification);
        
        // Show notification
        setTimeout(() => notification.classList.add('show'), 10);
        
        // Remove after 5 seconds
        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => notification.remove(), 300);
        }, 5000);
    }

    // Initialize the app when DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
</script>
